# 容器内使用服务名互访
api_keys:
  - sk-lab-demo-key
strategy: round_robin
health_interval_s: 5
breaker_fail_threshold: 3
breaker_cooldown_s: 20
backends:
  - name: mock-a
    base_url: http://mock-a:8001/v1
    model: mock-model
    weight: 2
  - name: mock-b
    base_url: http://mock-b:8002/v1
    model: mock-model
    weight: 1
