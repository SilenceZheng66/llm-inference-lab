services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      LAB_CONFIG: /srv/config/docker.yaml
    depends_on:
      - mock-a
      - mock-b

  mock-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uvicorn", "backends.mock_openai:app", "--host", "0.0.0.0", "--port", "8001"]

  mock-b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uvicorn", "backends.mock_openai:app", "--host", "0.0.0.0", "--port", "8002"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: lab-admin
